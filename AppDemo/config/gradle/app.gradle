apply {
    plugin "com.android.application"
    // Full ID required with AGP built-in Kotlin; alias "kotlin-parcelize" may not wire runtime.
    plugin "org.jetbrains.kotlin.plugin.parcelize"
    // Room annotation processing via KSP (kapt is incompatible with AGP built-in Kotlin).
    plugin "com.google.devtools.ksp"
}

kotlin {
    compilerOptions {
        jvmTarget = "JVM_17"
        suppressWarnings = true
    }
}

// AGP built-in Kotlin (newDsl) uses KotlinBaseApiPlugin; ParcelizeSubplugin does not
// auto-attach its compiler plugin to those compilations — wire it explicitly.
def parcelizeCompilerClasspath = configurations.create("parcelizeCompilerClasspath") {
    canBeConsumed = false
    canBeResolved = true
    //noinspection GrDeprecatedAPIUsage
    visible = false
}
dependencies.add(
        "parcelizeCompilerClasspath",
        "org.jetbrains.kotlin:kotlin-parcelize-compiler:${Versions.kotlin}"
)
tasks.configureEach { task ->
    if (task.name.contains("Kotlin") && task.hasProperty("pluginClasspath")) {
        task.pluginClasspath.from(parcelizeCompilerClasspath)
    }
}

android {
    compileSdk Android.compileSdk

    defaultConfig {
        if (Options.IS_PUBLISH) {
            println "applicationId ========= ${Android.applicationId}"
            applicationId Android.applicationId
        } else {
            println "applicationId ========= ${Android.applicationId_test}"
            applicationId Android.applicationId_test
        }

        minSdk Android.minSdk
        targetSdk Android.targetSdk
        versionCode Android.versionCode
        versionName Android.versionName

        //配置so库架构
        //noinspection ChromeOsAbiSupport
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }

        consumerProguardFiles file('.').listFiles(new FilenameFilter() {
            @Override
            boolean accept(File file, String s) {
                return s.endsWith('.pro')
            }
        })
    }
    buildTypes {
        release {
            //开启以下三条，打开混淆
            minifyEnabled true
            zipAlignEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    //减少编译错误和忽略 lint 检查
    packaging {
        jniLibs {
            keepDebugSymbols += ['*/armeabi-v7a/*.so', '*/arm64-v8a/*.so']
        }
        resources {
            excludes += [
                    'META-INF/*',
                    'LICENSE.txt',
            ]
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        dataBinding = true
        buildConfig = true
    }
    bundle {
        language {
            // This property is set to true by default.
            // You can specify `false` to turn off
            // generating configuration APKs for language resources.
            // These resources are instead packaged with each base and
            // feature APK.
            // Continue reading below to learn about situations when an app
            // might change setting to `false`, otherwise consider leaving
            // the default on for more optimized downloads.
            enableSplit = false
        }
//        density {
//            // This property is set to true by default.
//            enableSplit = true
//        }
//        abi {
//            // This property is set to true by default.
//            enableSplit = true
//        }
    }
}

configAppSigning project

def configAppSigning(Project project) {
    def signFile
    if (Options.IS_PUBLISH) {
        signFile = file("${rootDir.path}/config/sign/keystore.properties")
    } else {
        signFile = file("${rootDir.path}/config/sign_test/keystore.properties")
    }
    if (signFile == null || !signFile.exists()) {
        println "$project.name config sign failure..."
        return
    }

    println "$project.name config sign start..."
    project.android {
        Properties properties = new Properties()
        properties.load(new FileInputStream(signFile))
        signingConfigs {
            release {
                keyAlias properties['keyAlias']
                keyPassword properties['keyPassword']
                storeFile new File(signFile.getParent(), properties['storeFile'])
                storePassword properties['storePassword']

                enableV1Signing true  // JAR Signature Scheme (v1)
                enableV2Signing true  // APK Signature Scheme v2
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
        buildTypes.debug.signingConfig signingConfigs.release
    }
    println "$project.name config sign end..."
}

afterEvaluate {
    tasks.named("assembleRelease").configure {
        doLast {
            def apkDir = layout.buildDirectory.get().asFile.toPath()
                    .resolve("outputs/apk/release").toFile()
            def apk = apkDir.listFiles()?.find { it.name.endsWith(".apk") }
            if (apk != null) {
                def intoFile = new File(project.rootDir.path + "/apk")
                copy {
                    from apk
                    into intoFile
                    rename(apk.name, "${Android.appName}${Android.versionName}.apk")
                }
            }
        }
    }

    tasks.named("bundleRelease").configure {
        doLast {
            def outputPath = "${layout.buildDirectory.get()}/outputs/bundle/release"
            def allAabFile = project.fileTree(outputPath).findAll()
            if (allAabFile.size() != 0) {
                def outputFile = allAabFile.first()
                def outputFileName = outputFile.name
                def intoFile = new File(project.rootDir.path + "/apk")
                def intoFileName = "${Android.appName}${Android.versionName}.aab"
                copy {
                    from outputFile
                    into intoFile
                    rename(outputFileName, intoFileName)
                }
            }
        }
    }
}
