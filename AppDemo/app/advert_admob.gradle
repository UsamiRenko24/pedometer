android {
    defaultConfig {
        if (Options.IS_PUBLISH) {
            manifestPlaceholders.put("ADMOB_APP_ID", Options.ADMOB_ID)
            buildConfigField "String", "ADMOB_APP_ID", "\"${Options.ADMOB_ID}\""

            println()
            println("ADMOB_APP_ID RELEASE ============ >> ")
            println("${Options.ADMOB_ID}")
        } else {
            manifestPlaceholders.put("ADMOB_APP_ID", Options.ADMOB_ID_TEST)
            buildConfigField "String", "ADMOB_APP_ID", "\"${Options.ADMOB_ID_TEST}\""

            println()
            println("ADMOB_APP_ID DEBUG ============ >> ")
            println("${Options.ADMOB_ID_TEST}")
        }
    }
}

// Mediation adapters still depend on Legacy GMA; Next-Gen already ships those classes.
configurations.configureEach {
    exclude group: "com.google.android.gms", module: "play-services-ads"
    exclude group: "com.google.android.gms", module: "play-services-ads-lite"
}

repositories {
    flatDir { dirs 'libs' }

    //Ironsource
    maven { url "https://android-sdk.is.com/" }
    //Pangle
    maven { url "https://artifact.bytedance.com/repository/pangle" }
    //Chartboost
    maven { url "https://cboost.jfrog.io/artifactory/chartboost-ads" }
    maven { url "https://cboost.jfrog.io/artifactory/chartboost-mediation" }
    maven { url "https://cboost.jfrog.io/artifactory/chartboost-core" }
}

dependencies {
    //noinspection GradleDependency
    api 'com.google.guava:guava:33.6.0-android'

    //Vungle
    api 'com.google.ads.mediation:vungle:7.7.7.0'

    //UnityAds
    api 'com.unity3d.ads:unity-ads:4.19.0'
    api 'com.google.ads.mediation:unity:4.19.0.0'

    //Ironsource
    api 'com.google.ads.mediation:ironsource:9.5.0.0'

    //Pangle
    api 'com.google.ads.mediation:pangle:8.2.0.4.0'

    //Facebook
    api 'com.google.ads.mediation:facebook:6.22.0.0'

    // GMA Next-Gen SDK (replaces play-services-ads)
    api 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.4.0'

    //AppLovin
    api 'com.google.ads.mediation:applovin:13.6.3.0'

    //Chartboost
    api 'com.google.ads.mediation:chartboost:9.13.0.0'
}
